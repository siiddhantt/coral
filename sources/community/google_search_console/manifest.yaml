        expr:
          kind: from_filter
          key: start_date
      - name: end_date
        type: Utf8
        nullable: false
        virtual: true
        description: End date from required filter (YYYY-MM-DD).
        expr:
          kind: from_filter
          key: end_date
      - name: page
        type: Utf8
        nullable: true
        description: Landing page URL that appeared in search results.
        expr:
          kind: path
          path:
            - keys
            - "0"
      - name: clicks
        type: Int64
        nullable: true
        description: Click count from Google Search results.
        expr:
          kind: path
          path:
            - clicks
      - name: impressions
        type: Int64
        nullable: true
        description: Number of times the page appeared in search results.
        expr:
          kind: path
          path:
            - impressions
      - name: ctr
        type: Float64
        nullable: true
        description: Click-through rate (clicks / impressions).
        expr:
          kind: path
          path:
            - ctr
      - name: position
        type: Float64
        nullable: true
        description: Average position in search results.
        expr:
          kind: path
          path:
            - position

  - name: performance_by_country
