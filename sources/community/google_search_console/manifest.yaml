      method: POST
      path: /sites/{{filter.encoded_site_url}}/searchAnalytics/query
      body:
        - path:
            - startDate
          from: filter
          key: start_date
        - path:
            - endDate
          from: filter
          key: end_date
        - path:
            - dimensions
          from: literal
          value:
            - query
        - path:
            - rowLimit
          from: literal
          value: 25000
    response:
      rows_path:
        - rows
    pagination:
      mode: offset
      offset_param: startRow
      offset_start: 0
      page_size:
        default: 25000
        max: 25000
        body_path:
          - rowLimit
    columns:
      - name: encoded_site_url
        type: Utf8
        nullable: false
        virtual: true
        description: Encoded site URL from required filter.
        expr:
          kind: from_filter
          key: encoded_site_url
      - name: start_date
        type: Utf8
        nullable: false
        virtual: true
        description: Start date from required filter (YYYY-MM-DD).
        expr:
          kind: from_filter
          key: start_date
      - name: end_date
        type: Utf8
        nullable: false
        virtual: true
        description: End date from required filter (YYYY-MM-DD).
        expr:
          kind: from_filter
          key: end_date
      - name: query
        type: Utf8
        nullable: true
        description: Search query (keyword) used by the user.
        expr:
          kind: path
          path:
            - keys
            - "0"
      - name: clicks
        type: Int64
        nullable: true
        description: Click count from Google Search results.
        expr:
          kind: path
          path:
            - clicks
      - name: impressions
        type: Int64
        nullable: true
        description: Number of times the site appeared in search results.
        expr:
          kind: path
          path:
            - impressions
      - name: ctr
        type: Float64
        nullable: true
        description: Click-through rate (clicks / impressions).
        expr:
          kind: path
          path:
            - ctr
      - name: position
        type: Float64
        nullable: true
        description: Average position in search results.
        expr:
          kind: path
          path:
            - position

