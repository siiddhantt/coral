name: google_search_console
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query Google Search Console sites, search performance by date, query, page,
  country, and device from the Google Search Console API.
inputs:
  GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN:
    kind: secret
    hint: |
      Use an OAuth 2.0 access token with the Search Console readonly scope.
      For interactive setup, run
      `coral source add --interactive --file sources/community/google_search_console/manifest.yaml`
      and choose "Connect Google Search Console". Create a Google Cloud OAuth
      Desktop app client with the Search Console API enabled, then enter its
      client ID and client secret when prompted.

      The OAuth flow requests:
      https://www.googleapis.com/auth/webmasters.readonly
    credential:
      methods:
        - type: oauth
          label: Connect Google Search Console
          description: Use Google OAuth to retrieve a Search Console access token.
          oauth:
            flow:
              type: authorization_code
              pkce: required
            redirect_uri: http://127.0.0.1
            redirect_uri_port_mode: random
            endpoints:
              authorization_url: https://accounts.google.com/o/oauth2/v2/auth
              token_url: https://oauth2.googleapis.com/token
            client:
              id:
                input: GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_ID
              secret:
                input: GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_SECRET
                transport: request_body
            scopes:
              scope:
                delimiter: space
                values:
                  - https://www.googleapis.com/auth/webmasters.readonly
        - type: source_config
          label: Paste access token
          description: Paste an existing Google Search Console OAuth access token.
base_url: https://www.googleapis.com/webmasters/v3
auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN}}
request_headers:
  - name: Accept
    from: literal
    value: application/json
test_queries:
  - SELECT site_url, permission_level FROM google_search_console.sites LIMIT 1

tables:
  - name: sites
    description: >
      Lists all verified properties (sites) accessible to the authenticated
      user. Returns the site URL and the user's permission level. Use the
      site_url values from this table as required filter values in the
      performance tables.
    guide: >
      Start here to discover site URLs.
      `SELECT site_url, encoded_site_url, permission_level FROM google_search_console.sites`.
      The encoded_site_url values returned are URL-encoded and ready to use
      directly as required filter values in performance tables.
    request:
      method: GET
      path: /sites
    response:
      rows_path:
        - siteEntry
    pagination:
      mode: none
    columns:
      - name: site_url
        type: Utf8
        nullable: false
        description: >-
          Property URL as registered in Search Console. URL-prefix
          properties include protocol and trailing slash (e.g.
          https://example.com/). Domain properties use the sc-domain:
          prefix (e.g. sc-domain:example.com).
        expr:
          kind: path
          path:
            - siteUrl
      - name: encoded_site_url
        type: Utf8
        nullable: false
        description: >-
          URL-encoded property URL. Use this value for the encoded_site_url
          filter in the performance tables.
        expr:
          kind: replace
          expr:
            kind: replace
            expr:
              kind: path
              path:
                - siteUrl
            from: "/"
            to: "%2F"
          from: ":"
          to: "%3A"
      - name: permission_level
        type: Utf8
        nullable: true
        description: >-
          User's permission level for this property (siteOwner,
          siteFullUser, siteRestrictedUser, siteUnverifiedUser).
        expr:
          kind: path
          path:
            - permissionLevel

  - name: search_performance
    description: >
      Aggregate search performance metrics (clicks, impressions, CTR,
      position) for a site within a date range, without dimension grouping.
      Returns a single row with totals.
    guide: >
      Requires encoded_site_url, start_date, and end_date filters. The encoded_site_url
      must match a value from google_search_console.sites exactly.
      `SELECT * FROM google_search_console.search_performance
      WHERE encoded_site_url = 'https%3A%2F%2Fexample.com%2F'
      AND start_date = '2025-01-01' AND end_date = '2025-01-31'`.
    filters:
      - name: encoded_site_url
        required: true
      - name: start_date
        required: true
      - name: end_date
        required: true
    request:
      method: POST
      path: /sites/{{filter.encoded_site_url}}/searchAnalytics/query
      body:
        - path:
            - startDate
          from: filter
          key: start_date
        - path:
            - endDate
          from: filter
          key: end_date
        - path:
            - rowLimit
          from: literal
          value: 1
    response:
      rows_path:
        - rows
    pagination:
      mode: none
    columns:
      - name: encoded_site_url
        type: Utf8
        nullable: false
        virtual: true
        description: Encoded site URL from required filter.
        expr:
          kind: from_filter
          key: encoded_site_url
      - name: start_date
        type: Utf8
        nullable: false
        virtual: true
        description: Start date from required filter (YYYY-MM-DD).
        expr:
          kind: from_filter
          key: start_date
      - name: end_date
        type: Utf8
        nullable: false
        virtual: true
        description: End date from required filter (YYYY-MM-DD).
        expr:
          kind: from_filter
          key: end_date
      - name: clicks
        type: Int64
        nullable: true
        description: Total click count from Google Search results.
        expr:
          kind: path
          path:
            - clicks
      - name: impressions
        type: Int64
        nullable: true
        description: Total number of times the site appeared in search results.
        expr:
          kind: path
          path:
            - impressions
      - name: ctr
        type: Float64
        nullable: true
        description: Click-through rate (clicks / impressions).
        expr:
          kind: path
          path:
            - ctr
      - name: position
        type: Float64
        nullable: true
        description: Average position in search results.
        expr:
          kind: path
          path:
            - position

  - name: performance_by_date
    description: >
      Search performance metrics grouped by date. Each row represents one
      day's clicks, impressions, CTR, and average position. Days with zero
      data are omitted by the API.
    guide: >
      Requires encoded_site_url, start_date, and end_date filters.
      `SELECT date, clicks, impressions, ctr, position
      FROM google_search_console.performance_by_date
      WHERE encoded_site_url = 'https%3A%2F%2Fexample.com%2F'
      AND start_date = '2025-01-01' AND end_date = '2025-01-31'`.
    filters:
      - name: encoded_site_url
        required: true
      - name: start_date
        required: true
      - name: end_date
        required: true
    request:
      method: POST
      path: /sites/{{filter.encoded_site_url}}/searchAnalytics/query
      body:
        - path:
            - startDate
          from: filter
          key: start_date
        - path:
            - endDate
          from: filter
          key: end_date
        - path:
            - dimensions
          from: literal
          value:
            - date
        - path:
            - rowLimit
          from: literal
          value: 25000
    response:
      rows_path:
        - rows
    pagination:
      mode: offset
      offset_param: startRow
      offset_start: 0
      page_size:
        default: 25000
        max: 25000
        body_path:
          - rowLimit
    columns:
      - name: encoded_site_url
        type: Utf8
        nullable: false
        virtual: true
        description: Encoded site URL from required filter.
        expr:
          kind: from_filter
          key: encoded_site_url
      - name: start_date
        type: Utf8
        nullable: false
        virtual: true
        description: Start date from required filter (YYYY-MM-DD).
        expr:
          kind: from_filter
          key: start_date
      - name: end_date
        type: Utf8
        nullable: false
        virtual: true
        description: End date from required filter (YYYY-MM-DD).
        expr:
          kind: from_filter
          key: end_date
      - name: date
        type: Utf8
        nullable: true
        description: Date for this row (YYYY-MM-DD).
        expr:
          kind: path
          path:
            - keys
            - "0"
      - name: clicks
        type: Int64
        nullable: true
        description: Click count from Google Search results.
        expr:
          kind: path
          path:
            - clicks
      - name: impressions
        type: Int64
        nullable: true
        description: Number of times the site appeared in search results.
        expr:
          kind: path
          path:
            - impressions
      - name: ctr
        type: Float64
        nullable: true
        description: Click-through rate (clicks / impressions).
        expr:
          kind: path
          path:
            - ctr
      - name: position
        type: Float64
        nullable: true
        description: Average position in search results.
        expr:
          kind: path
          path:
            - position

  - name: performance_by_query
    description: >
      Search performance metrics grouped by search query (keyword). Each
