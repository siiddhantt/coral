      - name: country
        type: Utf8
        nullable: true
        description: Country code (ISO 3166-1 alpha-3, e.g. usa, gbr, deu).
        expr:
          kind: path
          path:
            - keys
            - "0"
      - name: clicks
        type: Int64
        nullable: true
